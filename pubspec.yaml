name: dolores_magico_app
description: >-
  Aplicación móvil de alcance municipal que impulsa la economía local conectando
  a turistas y residentes con los talleres artesanales de Talavera, neverías
  tradicionales y rutas históricas de Dolores Hidalgo C.I.N., integrando un
  módulo de participación ciudadana para reporte de servicios públicos urbanos.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Gestión de Estado Reactiva (Patrón MVVM)
  provider: ^6.1.2

  # Servicios en la Nube — Firebase (Autenticación, Base de Datos, Almacenamiento y Push)
  firebase_core: ^2.30.0
  firebase_auth: ^4.19.2
  cloud_firestore: ^4.17.0
  firebase_storage: ^11.7.2
  firebase_messaging: ^14.9.1

  # Mapa Interactivo y Geolocalización GPS (Sección 15)
  google_maps_flutter: ^2.6.1
  geolocator: ^11.0.0

  # Captura de Evidencia Fotográfica con Cámara / Galería (Sección 15)
  image_picker: ^1.1.0

  # Persistencia Local Sin Conexión — Repository Pattern (Sección 14)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Contacto Directo Sin Intermediarios (WhatsApp y Llamada Telefónica - HU04)
  url_launcher: ^6.2.6

  # Utilidades, Formateo y Criptografía (MASVS v2 & OWASP Mobile Top 10)
  intl: ^0.19.0
  cupertino_icons: ^1.0.6
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
